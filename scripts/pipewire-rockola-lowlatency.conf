# Copia a ~/.config/pipewire/pipewire.conf.d/99-rockola-lowlatency.conf
# Música con más margen (2048); el mic puede ir más bajo en su loopback.
context.properties = {
    default.clock.rate          = 48000
    default.clock.allowed-rates = [ 48000 ]
    default.clock.quantum       = 2048
    default.clock.min-quantum   = 512
    default.clock.max-quantum   = 4096
}
