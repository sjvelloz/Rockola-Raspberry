# Copia a ~/.config/pipewire/pipewire.conf.d/99-rockola-lowlatency.conf
# Quantum estable para música (mpv). La baja latencia del mic va solo en pw-loopback.
context.properties = {
    default.clock.rate          = 48000
    default.clock.allowed-rates = [ 48000 ]
    default.clock.quantum       = 1024
    default.clock.min-quantum   = 256
    default.clock.max-quantum   = 2048
}
